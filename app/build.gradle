plugins {
    id 'org.jetbrains.kotlin.jvm' version '1.9.25'
    id 'org.jetbrains.kotlin.plugin.spring' version '1.9.25'
    id 'org.jetbrains.kotlin.plugin.jpa' version '1.9.25'

    id 'application'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    // Use the Kotlin JUnit 5 integration.
    testImplementation 'org.jetbrains.kotlin:kotlin-test-junit5'

    // Use the JUnit 5 integration.
    testImplementation libs.junit.jupiter.engine

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // This dependency is used by the application.
    implementation libs.guava

    implementation "org.springframework.batch:spring-batch-core:5.2.0"
    implementation 'org.springframework.batch:spring-batch-infrastructure:5.2.0'

    implementation 'org.springframework.boot:spring-boot-starter:3.4.2'
    implementation 'org.springframework.boot:spring-boot-starter-quartz:3.4.2'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa:3.4.2'

    implementation 'org.apache.httpcomponents.client5:httpclient5:5.4.2'
    implementation 'com.mysql:mysql-connector-j:8.2.0'

    implementation 'org.jetbrains.kotlin:kotlin-reflect'
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

application {
    // Define the main class for the application.
    mainClass = 'org.example.AppKt'
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}
