spring:
  datasource:
    url: jdbc:mysql://localhost:3306/batch_db?useUnicode=true&characterEncoding=utf8
    username: admin
    password: admin
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate.format_sql: true
      dialect: org.hibernate.dialect.MySQLDialect